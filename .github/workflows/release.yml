# Builds the package and publishes to testpypi.org on every commit. On tagged commits, also publishes to pypi.org.
# https://packaging.python.org/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: release

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  pypi-publish:
    name: upload release to pypi
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: 3.10
          cache: pip

      - run: python -m pip install build --user
      - run: python -m build --sdist --wheel --outdir dist/ .

      - name: Upload to Test PyPI
        if: github.repository_owner == 'maxwelllevin' && github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Upload to PyPI (tagged release only)
        if: github.repository_owner == 'maxwelllevin' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
